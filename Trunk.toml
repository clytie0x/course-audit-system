# Trunk build config. Pass `--public-url /course-audit-system/` for GitHub Pages builds.

# The styles use Tailwind v3 (tailwind.config.js + @tailwind directives);
# Trunk 0.22 downloads v4 by default, which silently drops most classes.
[tools]
tailwindcss = "3.4.17"

[build]
target = "index.html"
dist   = "dist"

[serve]
address = "127.0.0.1"
port    = 8080
