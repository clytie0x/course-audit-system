[package]
name = "course-audit-system"
version = "1.0.0"
edition = "2021"

[workspace]
members = ["crates/audit-core"]

[dependencies]
audit-core = { path = "crates/audit-core" }
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
web-sys = { version = "0.3", features = [
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "Url",
    "Blob",
    "Event",
    "DragEvent",
    "DataTransfer",
    "FileReader",
    "DomTokenList",
    "Storage",
    "Navigator",
    "Clipboard",
    "HtmlElement",
] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-file = { version = "0.3", features = ["futures"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
