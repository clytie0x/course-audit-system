name: Refresh SIS offerings

# Weekly: scrape the two newest terms SIS lists (new terms are picked up
# automatically) and commit data/offerings when anything changed. Deploy runs
# afterwards via its workflow_run trigger.
#
# Runs on a self-hosted runner: SIS sits behind Cloudflare, which answers
# GitHub-hosted runners with HTTP 403. If the runner is offline the job waits
# in the queue for up to 24 hours. Setup and safety notes are in the README.
#
# Do not enable the setup-node npm cache here. On this runner `npm config get
# cache` is the Windows user's global npm directory. The 22 Nov 2026 success
# uploaded 2.77 GB of it, and the next scheduled run lost communication with
# GitHub while restoring that cache. playwright-core installs in under a second.
on:
  schedule:
    - cron: '0 20 * * 0' # Sunday 20:00 UTC = Monday 03:00 in Thailand
  workflow_dispatch:
    inputs:
      latest:
        description: Number of newest terms to refresh
        default: '2'

permissions:
  contents: write

concurrency:
  group: offerings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 120
    defaults:
      run:
        shell: bash # Git Bash on a Windows runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install scraper
        working-directory: tools/sis-scraper
        run: npm ci

      - name: Scrape (uses the runner's preinstalled Google Chrome)
        working-directory: tools/sis-scraper
        run: node scrape.mjs --latest "${{ github.event.inputs.latest || '2' }}" --ge

      - name: Guard against personal numbers
        run: |
          if grep -niE '\b[0-9]{10}\b|Passcode *[:：]? *[0-9]|Zoom *ID *[:：]? *[0-9]' data/offerings/*.json; then
            echo "::error::10-digit numbers, passcodes or Zoom IDs found in data/offerings"; exit 1
          fi

      - name: Commit changes
        run: bash tools/sis-scraper/commit-offerings.sh
