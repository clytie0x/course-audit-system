version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - 'svelte*'
          - '@sveltejs/*'
      tailwind:
        patterns:
          - 'tailwindcss*'
          - '@tailwindcss/*'
      lint-test:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript-eslint'
          - 'vitest*'
          - '@playwright/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
