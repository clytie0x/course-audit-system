version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      leptos:
        patterns:
          - "leptos*"
      wasm-bindgen:
        patterns:
          - "wasm-bindgen*"
          - "js-sys"
          - "web-sys"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
