<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Privacy-first WebAssembly app for auditing PSU Computer Science transcripts against curriculum requirements. 100% client-side processing.">
    <meta name="theme-color" content="#fafafa">
    <meta name="color-scheme" content="light">

    <meta property="og:title" content="Course Audit — PSU CS">
    <meta property="og:description"
        content="Upload your transcript PDF and instantly audit your academic progress — all processing happens locally in your browser.">
    <meta property="og:type" content="website">
    <title>Course Audit — PSU CS</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="tailwind-css" href="style.css" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link rel="manifest" href="manifest.webmanifest" />

    <script>
        // Register the service worker for offline / installable PWA support.
        // Only on production-ish origins (file:// and localhost dev-server
        // still let the app run normally — registration simply no-ops).
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () { });
            });
        }
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }


        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 99px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }



        /* Animate progress bars on load */
        @keyframes progressGrow {
            from {
                width: 0%;
            }
        }

        .progress-animated {
            animation: progressGrow 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Stagger children fade-in */
        @keyframes staggerFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stagger-in>* {
            animation: staggerFadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .stagger-in>*:nth-child(1) {
            animation-delay: 0ms;
        }

        .stagger-in>*:nth-child(2) {
            animation-delay: 60ms;
        }

        .stagger-in>*:nth-child(3) {
            animation-delay: 120ms;
        }

        .stagger-in>*:nth-child(4) {
            animation-delay: 180ms;
        }

        .stagger-in>*:nth-child(5) {
            animation-delay: 240ms;
        }

        /* Donut chart animation */
        @keyframes donutFill {
            from {
                stroke-dasharray: 0 100;
            }
        }

        .donut-animated {
            animation: donutFill 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Pulse dot */
        @keyframes pulseDot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .pulse-dot {
            animation: pulseDot 2s ease-in-out infinite;
        }
    </style>

    <!-- Global fatal-error overlay: captures uncaught exceptions and unhandled
         rejections and surfaces them to the user, so a Rust panic or JS error
         no longer shows an empty page. -->
    <style>
        #fatal-error {
            position: fixed; inset: 0; background: rgba(24,24,27,0.85);
            display: none; align-items: center; justify-content: center;
            padding: 1.5rem; z-index: 9999; font-family: 'Anuphan',system-ui,sans-serif;
        }
        #fatal-error[data-open="true"] { display: flex; }
        #fatal-error > div {
            background: white; color: #18181b; max-width: 32rem;
            border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        #fatal-error h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 0.5rem; }
        #fatal-error p  { font-size: 0.875rem; color: #52525b; margin: 0 0 0.75rem; line-height: 1.5; }
        #fatal-error pre { font-family: 'IBM Plex Mono',ui-monospace,monospace; font-size: 0.75rem; background: #fafafa; border: 1px solid #e4e4e7; border-radius: 0.5rem; padding: 0.75rem; overflow-x: auto; max-height: 8rem; }
        #fatal-error button { margin-top: 0.75rem; background: #18181b; color: white; border: 0; border-radius: 0.5rem; padding: 0.5rem 0.9rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    </style>
    <script>
        (function () {
            var overlay, msgEl, details;
            function show(message, detail) {
                if (!overlay) return;
                msgEl.textContent = message;
                details.textContent = detail || '';
                overlay.setAttribute('data-open', 'true');
            }
            window.addEventListener('DOMContentLoaded', function () {
                overlay = document.getElementById('fatal-error');
                msgEl = document.getElementById('fatal-error-msg');
                details = document.getElementById('fatal-error-details');
                document.getElementById('fatal-error-reload').addEventListener('click', function () {
                    location.reload();
                });
            });
            window.addEventListener('error', function (e) {
                show('The app hit an unexpected error.', (e.error && e.error.stack) || e.message);
            });
            window.addEventListener('unhandledrejection', function (e) {
                show('The app hit an unexpected error.', (e.reason && (e.reason.stack || String(e.reason))) || '');
            });
        })();
    </script>

    <!-- PDF.js 3.11.174, vendored from pdfjs-dist (same bytes as the cdnjs build) so it works offline -->
    <link data-trunk rel="copy-dir" href="vendor/pdfjs" />
    <!-- Anuphan and IBM Plex Mono (OFL), self-hosted instead of Google Fonts -->
    <link data-trunk rel="copy-dir" href="vendor/fonts" />
    <link rel="preload" href="fonts/anuphan-thai-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/anuphan-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Course offerings scraped from SIS by tools/sis-scraper -->
    <link data-trunk rel="copy-dir" href="data/offerings" />
</head>

<body>
    <div id="fatal-error" role="alertdialog" aria-live="assertive" aria-labelledby="fatal-error-msg">
        <div>
            <h2 id="fatal-error-msg">Something went wrong.</h2>
            <p>The app hit an unexpected error. Reloading usually fixes it. If it keeps happening, please open an issue with the details below.</p>
            <pre id="fatal-error-details"></pre>
            <button id="fatal-error-reload" type="button">Reload</button>
        </div>
    </div>
    <noscript>
        <div style="text-align:center;padding:4rem;font-family:'Anuphan',system-ui,sans-serif;color:#18181b;">
            <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">JavaScript Required</h1>
            <p style="color:#71717a;">This application requires JavaScript and WebAssembly to run.</p>
        </div>
    </noscript>
    <!-- PDF Text Extraction Helper -->
    <script>
        // pdf.js is loaded on first use so it never blocks the first paint.
        let pdfJsLoading = null;
        function loadPdfJs() {
            if (!pdfJsLoading) {
                pdfJsLoading = new Promise(function (resolve, reject) {
                    const s = document.createElement('script');
                    s.src = 'pdfjs/pdf.min.js';
                    s.integrity = 'sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ==';
                    s.onload = function () {
                        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
                        resolve();
                    };
                    s.onerror = function () {
                        pdfJsLoading = null;
                        reject(new Error('PDF.js could not be loaded. Please reload the page.'));
                    };
                    document.head.appendChild(s);
                });
            }
            return pdfJsLoading;
        }

        // Print every collapsed course list, then restore what was closed.
        let openedForPrint = [];
        window.addEventListener('beforeprint', function () {
            openedForPrint = Array.from(document.querySelectorAll('details:not([open])'));
            openedForPrint.forEach(function (d) { d.open = true; });
        });
        window.addEventListener('afterprint', function () {
            openedForPrint.forEach(function (d) { d.open = false; });
            openedForPrint = [];
        });

        window.extractTextFromPDF = async function (arrayBuffer) {
            await loadPdfJs();
            try {
                // isEvalSupported: false mitigates CVE-2024-4367 (font eval) in pdf.js < 4.2.67.
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer, isEvalSupported: false }).promise;
                let fullText = '';
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + '\n';
                }
                return fullText;
            } catch (error) {
                console.error('PDF extraction error:', error);
                throw new Error('Failed to extract text from PDF: ' + error.message);
            }
        };
    </script>
</body>

</html>
